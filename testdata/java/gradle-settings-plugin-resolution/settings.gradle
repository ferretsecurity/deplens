pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.example.internal') { useModule('com.example:internal-gradle-plugin:1.4.0') }
            if (requested.id.id == 'org.example.legacy') { useVersion('3.2.1') }
        }
    }
    repositories { maven { url = uri('https://plugins.example.test/releases') }; gradlePluginPortal() }
}

rootProject.name = 'plugin-resolution'
