  - id: soldeer-lock
    form: lockfile
    roles: [resolution, integrity]
    filename-regex: '^soldeer\.lock$'
  - id: js-banner-block-start
    form: source-code
    roles: [usage, inventory]
    package-type: npm
    filename-regex: '.*\.js$'
    analyzer:
      type: banner-regex
      pattern: '(?i)^\s*/\*!\s*([A-Za-z0-9@._/-]+)\s+v?(\d+\.\d+\.\d+(?:[-+.\w]*))[^\r\n]*\*/'
  - id: js-banner-plain-block-start
    form: source-code
    roles: [usage, inventory]
    package-type: npm
    filename-regex: '.*\.js$'
    analyzer:
      type: banner-regex
      pattern: '(?i)^\s*/\*\s*([A-Za-z0-9@._/-]+)\s+v?(\d+\.\d+\.\d+(?:[-+.\w]*))[^\r\n]*\*/'
  - id: js-banner-multiline-preserved
    form: source-code
    roles: [usage, inventory]
    package-type: npm
    filename-regex: '.*\.js$'
    analyzer:
      type: banner-regex
      pattern: '(?is)^\s*/\*![\s*]*([A-Za-z0-9@._/-]+)\s+v?(\d+\.\d+\.\d+(?:[-+.\w]*)).*?\*/'
  - id: js-banner-line-comment
    form: source-code
    roles: [usage, inventory]
    package-type: npm
    filename-regex: '.*\.js$'
    analyzer:
      type: banner-regex
      pattern: '(?im)^\s*//[!/]\s*([A-Za-z0-9@._/-]+)\s+v?(\d+\.\d+\.\d+(?:[-+.\w]*))\b'
  - id: js-banner-version-tagged
    form: source-code
    roles: [usage, inventory]
    package-type: npm
    filename-regex: '.*\.js$'
    analyzer:
      type: banner-regex
      pattern: '(?is)^\s*/\*![^*]*package:\s*([A-Za-z0-9@._/-]+)[^*]*version:\s*v?(\d+\.\d+\.\d+(?:[-+.\w]*))[^*]*\*/'
  - id: html-external-scripts
    form: markup
    roles: [usage]
    filename-regex: '.*\.(html|htm|xhtml|tmpl|gohtml|mustache|hbs|njk)$'
    analyzer:
      type: html
      external_scripts: true
  - id: terraform.aws_glue_job.python
    form: source-code
    roles: [usage, inventory]
    package-type: pypi
    filename-regex: '.*\.tf$'
    analyzer:
      type: terraform
      resource_type: aws_glue_job
      conditions:
        - path: default_arguments.--job-language
          equals: python
        - path: default_arguments.--additional-python-modules
          present: true
  - id: typescript.cdk.aws_glue_job.python
    form: source-code
    roles: [usage, inventory]
    package-type: pypi
    filename-regex: '.*\.ts$'
    analyzer:
      type: typescript
      cdk_construct:
        module: aws-cdk-lib/aws-glue
        construct: CfnJob
        props_argument_index: 2
        within:
          - defaultArguments
        conditions:
          - key: --additional-python-modules
            present: true
          - key: --job-language
            equals: python
        extract:
          key: --additional-python-modules
          split: comma
  - id: python.cdk.aws_glue_job.python
    form: source-code
    roles: [usage, inventory]
    package-type: pypi
    filename-regex: '.*\.py$'
    analyzer:
      type: python
      cdk_construct:
        module: aws_cdk.aws_glue
        construct: CfnJob
        keyword_argument: default_arguments
        conditions:
          - key: --additional-python-modules
            present: true
          - key: --job-language
            equals: python
        extract:
          key: --additional-python-modules
          split: comma

checks:
  - id: javascript-npm-lockfile-missing
    summary: npm project has dependencies but no npm lockfile
    severity: medium
    evaluator:
      type: npm-lockfile-missing
    remediation: Run `npm install` and commit the generated lockfile.
  - id: javascript-pnpm-lockfile-missing
    summary: pnpm project has dependencies but no pnpm lockfile
    severity: medium
    evaluator:
      type: pnpm-lockfile-missing
    remediation: Run `pnpm install` at the workspace root and commit pnpm-lock.yaml.
  - id: javascript-yarn-lockfile-missing
    summary: Yarn project has dependencies but no Yarn lockfile
    severity: medium
    evaluator:
      type: yarn-lockfile-missing
    remediation: Run `yarn install` at the workspace root and commit yarn.lock.
  - id: javascript-conflicting-lockfiles
    summary: JavaScript project has conflicting package-manager lockfiles
    severity: medium
    evaluator:
      type: javascript-conflicting-lockfiles
    remediation: Choose one package manager, remove lockfiles from the others, and declare packageManager in package.json.
  - id: python-uv-lockfile-missing
    summary: uv-managed project has dependencies but no uv lockfile
    severity: medium
    evaluator:
      type: uv-lockfile-missing
    remediation: Run `uv lock` and commit uv.lock.
  - id: rust-cargo-lockfile-missing-for-application
    summary: Cargo application has dependencies but no Cargo lockfile
    severity: medium
    evaluator:
      type: cargo-application-lockfile-missing
    remediation: Run `cargo generate-lockfile` and commit Cargo.lock.
  - id: go-sum-missing
    summary: Go module has external dependencies but no go.sum
    severity: medium
    evaluator:
      type: go-sum-missing
    remediation: Run `go mod tidy` (or `go mod download`) and commit go.sum.
  - id: php-composer-lockfile-missing-for-application
    summary: Composer application has dependencies but no composer.lock
    severity: medium
    evaluator:
      type: composer-application-lockfile-missing
    remediation: Run `composer update` and commit composer.lock.
  - id: ruby-gemfile-lockfile-missing-for-application
    summary: Ruby application has dependencies but no Gemfile.lock
    severity: medium
    evaluator:
      type: gemfile-application-lockfile-missing
    remediation: Run `bundle install` and commit Gemfile.lock.
  - id: dependency-source-codeowners-missing
    summary: Dependency source has no code owner
    severity: medium
    evaluator:
      type: dependency-source-codeowners
      platform: auto
    remediation: Create or update CODEOWNERS so the dependency source matches at least one valid owner.
