rules:
  - id: python-requirements
    form: requirements
    roles: [declaration, constraint]
    package-type: pypi
    filename-regex: '(^|.*[^A-Za-z])requirements([^A-Za-z].*)?\.(txt|in)$'
    analyzer:
      type: py-requirements
  - id: python-requirements-dir
    form: requirements
    roles: [declaration, constraint]
    package-type: pypi
    path-glob: '**/requirements/*.txt'
    analyzer:
      type: py-requirements
  - id: python-uv
    form: lockfile
    roles: [resolution, integrity]
    package-type: pypi
    filename-regex: '^uv\.lock$'
    analyzer:
      type: uv-lock
  - id: python-poetry-lock
    form: lockfile
    roles: [resolution, integrity]
    package-type: pypi
    filename-regex: '^poetry\.lock$'
    analyzer:
      type: poetry-lock
  - id: python-pipfile-lock
    form: lockfile
    roles: [resolution, integrity]
    package-type: pypi
    filename-regex: '^Pipfile\.lock$'
    analyzer:
      type: pipfile-lock
  - id: python-pdm-lock
    form: lockfile
    roles: [resolution, integrity]
    filename-regex: '^pdm\.lock$'
    analyzer:
      type: toml
      exists-any:
        - package
  - id: python-conda-lock
    form: lockfile
    roles: [resolution, integrity]
    filename-regex: '^conda-lock\.yml$'
    analyzer:
      type: yaml
      exists-any:
        - package
  - id: python-conda-env-alt
    form: manifest
    roles: [declaration, constraint]
    filename-regex: '^conda\.ya?ml$'
  - id: python-pyproject
    form: manifest
    roles: [declaration, constraint]
    package-type: pypi
    filename-regex: '^pyproject\.toml$'
    analyzer:
      type: toml
      queries:
        - build-system.requires[]
        - project.dependencies[]
        - project.optional-dependencies.*[]
        - dependency-groups.*[]
        - tool.poetry.dependencies
        - tool.poetry.group.*.dependencies
  - id: python-conda-environment
    form: manifest
    roles: [declaration, constraint]
    filename-regex: '^environment\.ya?ml$'
    analyzer:
      type: yaml
      exists: dependencies
  - id: python-pipfile
    form: manifest
    roles: [declaration, constraint]
    package-type: pypi
    filename-regex: '^Pipfile$'
    analyzer:
      type: toml
      table-queries:
        - '*'
      exclude-keys:
        - source
        - requires
        - scripts
        - pipenv
  - id: python-setup-py
    form: manifest
    roles: [declaration, constraint]
    package-type: pypi
    filename-regex: '^setup\.py$'
    analyzer:
      type: python
      call:
        module: setuptools
        function: setup
        conditions:
          any_of:
            - keyword: install_requires
              present: true
            - keyword: extras_require
              present: true
        extract:
          - keyword: install_requires
            literal: string_list
          - keyword: extras_require
            literal: dict_string_lists
  - id: python-setup-cfg
    form: manifest
    roles: [declaration, constraint]
    package-type: pypi
    filename-regex: '^setup\.cfg$'
    analyzer:
      type: ini
      queries:
        - section: options
          key: setup_requires
        - section: options
          key: install_requires
        - section: options.extras_require
          key: '*'
  - id: python-constraints
    form: constraint-file
    roles: [constraint]
    filename-regex: '^constraints\.txt$'
  - id: js
    package-type: npm
    form: manifest
    roles: [declaration, constraint]
    filename-regex: '^package\.json$'
    analyzer:
      type: package-json
  - id: js-bower
    package-type: generic
    form: manifest
    roles: [declaration, constraint]
    filename-regex: '^bower\.json$'
    analyzer:
      type: bower
  - id: js-npm-shrinkwrap
    form: lockfile
    roles: [resolution, integrity]
    package-type: npm
    filename-regex: '^npm-shrinkwrap\.json$'
    analyzer:
      type: package-lock
  - id: js-npm-lock
    form: lockfile
    roles: [resolution, integrity]
    package-type: npm
    filename-regex: '^package-lock\.json$'
    analyzer:
      type: package-lock
  - id: js-yarn
    form: lockfile
    roles: [resolution, integrity]
    package-type: npm
    filename-regex: '^yarn\.lock$'
    analyzer:
      type: yarn-lock
  - id: js-pnpm-lock
    form: lockfile
    roles: [resolution, integrity]
    package-type: npm
    filename-regex: '^pnpm-lock\.yaml$'
    analyzer:
      type: pnpm-lock
  - id: js-bun-lock
    package-type: npm
