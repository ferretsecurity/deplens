    filename-regex: '^deno\.jsonc$'
    analyzer:
      type: deno-jsonc
  - id: js-pnp
    form: vendored-file
    roles: [inventory, resolution]
    filename-regex: '^\.pnp\.(cjs|loader\.mjs)$'
  - id: js-pnpm-workspace
    form: workspace-definition
    roles: [workspace, configuration]
    filename-regex: '^pnpm-workspace\.ya?ml$'
  - id: js-npmrc
