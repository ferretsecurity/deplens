[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audit-harvest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "anthropic>=0.40.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tiktoken>=0.7.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0",
    "dockerfile-parse>=0.0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
audit-harvest-mcp = "audit_harvest.mcp_server.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: marks tests requiring real external tools (deselect with -m 'not integration')"]
